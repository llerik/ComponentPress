[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "componentpress"
version = "0.14"
description = "Редактор печатных компонентов настольных игр"
requires-python = ">=3.14"
dependencies = [
  "PySide6>=6.11,<6.12",
  "openpyxl>=3.1,<3.2",
  "ruamel.yaml>=0.19,<0.20",
  "pydantic>=2.13,<3",
  "Jinja2>=3.1,<3.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-qt>=4.5,<5"]
package = ["PyInstaller>=6.22,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"componentpress.app_assets" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
