[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "componentpress"
dynamic = ["version"]
description = "Редактор печатных компонентов настольных игр"
requires-python = ">=3.14"
dependencies = [
  "PyQtDarkTheme-fork>=2.3.6,<3",
  "PySide6>=6.11,<6.12",
  "openpyxl>=3.1,<3.2",
  "ruamel.yaml>=0.19,<0.20",
  "pydantic>=2.13,<3",
  "Jinja2>=3.1,<3.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-qt>=4.5,<5", "pytest-xdist>=3.8,<4"]
package = ["PyInstaller>=6.22,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "componentpress.version.APPLICATION_VERSION"}

[tool.setuptools.package-data]
"componentpress.app_assets" = ["*.png"]
"componentpress.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: uses Qt widgets, input, or desktop integration and must run sequentially"]
